name: Build and publish Windows release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Quarantine known broken release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v2.16.3 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit v2.16.3 --prerelease --repo $env:GITHUB_REPOSITORY
          }

      - name: Read version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if (-not $version) { throw "VERSION is empty" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt

      - name: Verify source completeness
        shell: pwsh
        run: |
          $mainSize = (Get-Item app/main.py).Length
          $dbSize = (Get-Item app/db.py).Length
          if ($mainSize -lt 200000) { throw "app/main.py is incomplete: $mainSize bytes" }
          if ($dbSize -lt 80000) { throw "app/db.py is incomplete: $dbSize bytes" }
          python -m compileall -q app
          python -c "import sys; sys.path.insert(0, 'app'); import main; assert hasattr(main, 'App'), 'App class missing'; assert hasattr(main, 'main'), 'main entry point missing'"

      - name: Verify application version
        shell: pwsh
        run: |
          python -c "import sys; sys.path.insert(0, 'app'); import app_version; v=open('VERSION', encoding='utf-8').read().strip(); assert app_version.__version__ == v, f'app_version={app_version.__version__}, VERSION={v}'"

      - name: Build Windows EXE
        shell: pwsh
        run: |
          Set-Location app
          python -m PyInstaller --onefile --windowed --name UchetZakupok --collect-data spellchecker --additional-hooks-dir=. main.py
          Set-Location ..
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item app/dist/UchetZakupok.exe release/UchetZakupok.exe -Force
          $hash = (Get-FileHash release/UchetZakupok.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  UchetZakupok.exe" | Set-Content release/UchetZakupok.exe.sha256 -Encoding ascii

      - name: Smoke-test Windows EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          $exe = (Resolve-Path release/UchetZakupok.exe).Path
          $p = Start-Process -FilePath $exe -WorkingDirectory (Resolve-Path smoke).Path -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "UchetZakupok.exe exited during startup smoke test (exit code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG release/UchetZakupok.exe release/UchetZakupok.exe.sha256 --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $env:TAG --title $env:TAG --notes-file RELEASE_NOTES.md --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:TAG release/UchetZakupok.exe release/UchetZakupok.exe.sha256 --title $env:TAG --notes-file RELEASE_NOTES.md --target main --repo $env:GITHUB_REPOSITORY
          }
