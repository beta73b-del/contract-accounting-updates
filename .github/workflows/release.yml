name: Build and publish Windows release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if (-not $version) { throw "VERSION is empty" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Validate source completeness
        shell: pwsh
        run: |
          $main = Get-Content app/main.py -Raw
          $db = Get-Content app/db.py -Raw
          if ($main.Length -lt 200000) { throw "main.py is incomplete: $($main.Length) chars" }
          if ($db.Length -lt 70000) { throw "db.py is incomplete: $($db.Length) chars" }
          if ($main -notmatch 'class App\(tk\.Tk\)') { throw "main.py: App class missing" }
          if ($main -notmatch 'def main\(\)') { throw "main.py: main() missing" }
          if ($main -notmatch 'if __name__ == "__main__"') { throw "main.py: entrypoint missing" }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt

      - name: Compile and import smoke test
        shell: pwsh
        run: |
          python -m compileall -q app
          python -c "import sys; sys.path.insert(0, 'app'); import main; assert hasattr(main, 'App'); assert hasattr(main, 'PurchaseDialog')"

      - name: Verify application version
        shell: pwsh
        run: |
          python -c "import sys; sys.path.insert(0, 'app'); import app_version; v=open('VERSION', encoding='utf-8').read().strip(); assert app_version.__version__ == v, f'app_version={app_version.__version__}, VERSION={v}'"

      - name: Verify month-added accounting logic
        shell: pwsh
        run: |
          python -c "import os,sys,tempfile; sys.path.insert(0,'app'); import db,main; p=os.path.join(tempfile.mkdtemp(),'logic.db'); conn=db.get_connection(p); pid=db.insert_purchase(conn, {'customer':'Тест','contract_no':'T-1','contract_date':'2024-01-15','contract_sum':1000,'payment_status':'Не оплачено','exec_status':'В процессе','contract_status':'Формирование'}, []); conn.execute('UPDATE purchases SET created_at=? WHERE id=?',('2026-05-15 12:00:00',pid)); conn.commit(); assert len(db.fetch_all(conn,year=2026,month=5))==1; assert len(db.fetch_all(conn,year=2026,month=1))==0; s=db.monthly_summary(conn,year=2026,month=5); assert len(s)==1 and s[0]['month']==5 and s[0]['contract_sum']==1000; assert all(x[0] != 'created_at' for x in main.PurchaseDialog.HEADER_LABELS); assert all(x[0] != 'created_at' for x in main.App.PURCHASE_COLS); conn.close()"

      - name: Verify UX v2.16.8 structure
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          main = Path("app/main.py").read_text(encoding="utf-8")
          theme = Path("app/theme.py").read_text(encoding="utf-8")

          assert 'nb.add(self.tab_deadlines' not in main
          assert 'self._build_deadlines_tab()' not in main
          assert 'self.refresh_deadlines()' not in main

          assert 'ttk.LabelFrame(left_col, text="Контракт"' in main
          assert 'ttk.LabelFrame(left_col, text="Сроки"' in main
          assert 'ttk.LabelFrame(left_col, text="Состояние"' in main

          assert 'self.next_action_button = ttk.Button' in main
          assert 'next_action_label' not in main
          assert 'NextAction.TButton' in theme

          assert 'self.doc_expanded = False' in main
          assert main.index('self._refresh_items_tree()') < main.index('self._build_documents_section(body)')

          assert 'GitHub repository:' not in main
          assert 'update_github_repo' not in main
          assert 'repo = DEFAULT_UPDATE_REPO' in main

          assert '● Данные сохранены' in main
          assert 'self.health_status_var, style="CardMuted.TLabel"' not in main

          assert 'self.stock_notebook.add(self.stock_balances_tab, text="Остатки")' in main
          assert 'self.stock_notebook.add(self.stock_receipts_tab, text="Приходы")' in main
          assert 'self.stock_notebook.add(self.stock_reservations_tab, text="Резервы")' in main
          '@ | python -

      - name: Build Windows EXE
        shell: pwsh
        run: |
          Set-Location app
          python -m PyInstaller --onefile --windowed --name UchetZakupok --collect-data spellchecker --additional-hooks-dir=. main.py
          Set-Location ..
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item app/dist/UchetZakupok.exe release/UchetZakupok.exe -Force
          $hash = (Get-FileHash release/UchetZakupok.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  UchetZakupok.exe" | Set-Content release/UchetZakupok.exe.sha256 -Encoding ascii

      - name: Runtime EXE smoke test
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\UchetZakupokSmoke"
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $p = Start-Process -FilePath "release\UchetZakupok.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "UchetZakupok.exe exited during startup smoke test with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Upload validated recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: UchetZakupok-${{ env.TAG }}
          path: |
            release/UchetZakupok.exe
            release/UchetZakupok.exe.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG release/UchetZakupok.exe release/UchetZakupok.exe.sha256 --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $env:TAG --title $env:TAG --notes-file RELEASE_NOTES.md --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:TAG release/UchetZakupok.exe release/UchetZakupok.exe.sha256 --title $env:TAG --notes-file RELEASE_NOTES.md --target main --repo $env:GITHUB_REPOSITORY
          }
