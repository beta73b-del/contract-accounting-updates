name: Validate Windows application (no release)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - ".github/workflows/validate-main.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt
      - name: Compile and import
        shell: pwsh
        run: |
          python -m compileall -q app
          python -c "import sys; sys.path.insert(0, 'app'); import main, db, excel_export; assert hasattr(main, 'App')"
      - name: Financial Excel regression
        run: python tests/test_excel_tax_export.py
      - name: Existing regression suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = @()
          Get-ChildItem tests/test_*.py | Where-Object { $_.Name -ne 'test_excel_tax_export.py' } | Sort-Object Name | ForEach-Object {
            Write-Host "=== $($_.Name) ==="
            python $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $_.Name }
          }
          if ($failed.Count -gt 0) {
            throw "Failed tests: $($failed -join ', ')"
          }
