name: Validate and build v2.18.0 manual

on:
  push:
    branches:
      - v2.18.0
    paths:
      - VERSION
      - app/**
      - tests/**
      - .github/workflows/validate-build-v2180.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt

      - name: Compile and import
        shell: pwsh
        run: |
          python -m compileall -q app
          python -c "import sys; sys.path.insert(0,'app'); import main,db; assert hasattr(main,'App'); assert hasattr(main,'PurchaseDialog'); assert hasattr(db,'summary_contracts'); assert hasattr(db,'insert_monthly_expense')"

      - name: Verify version and manual update mode
        shell: pwsh
        run: |
          python -c "import sys; sys.path.insert(0,'app'); import app_version; assert app_version.__version__=='2.18.0'"
          python -c "from pathlib import Path; s=Path('app/main.py').read_text(encoding='utf-8'); assert 'self.after(1800, self._start_update_check)' not in s; assert 'Автоматическое обновление отключено' in s"
          python -c "import sys; sys.path.insert(0,'app'); import main; assert hasattr(main.App,'_open_trash'); assert hasattr(main.App,'_backup_now'); assert hasattr(main.App,'_restore_backup')"

      - name: Run v2.17.2 regression
        shell: pwsh
        run: python tests/test_v2172_regression.py

      - name: Run v2.17.3 regression
        shell: pwsh
        run: python tests/test_v2173_changes.py

      - name: Run v2.18.0 finance regression
        shell: pwsh
        run: python tests/test_v2180_finance.py

      - name: Verify local DB conflict protection
        shell: pwsh
        run: |
          @'
          import os, sys, tempfile, sqlite3
          sys.path.insert(0,'app')
          import db
          root=tempfile.mkdtemp()
          os.environ['ZAKUPKI_LOCAL_DATA']=os.path.join(root,'local')
          os.makedirs(os.environ['ZAKUPKI_LOCAL_DATA'],exist_ok=True)
          cloud_root=os.path.join(root,'portable')
          os.makedirs(os.path.join(cloud_root,'data'),exist_ok=True)
          db.app_root_dir=lambda: cloud_root
          local=db.default_db_path(); cloud=db.cloud_db_path()
          for path,name in ((local,'LOCAL_KEEP'),(cloud,'CLOUD_OTHER')):
              c=sqlite3.connect(path); c.execute('create table t(v text)'); c.execute('insert into t values(?)',(name,)); c.commit(); c.close()
          db._write_json_atomic(db._local_state_path(), {'protocol':db.SYNC_PROTOCOL_VERSION,'db_sha256':'old-cloud','local_sha256':'old-local'})
          before=open(local,'rb').read()
          st=db.prepare_working_storage()
          after=open(local,'rb').read()
          assert st['action']=='conflict_local_preserved', st
          assert before==after
          c=sqlite3.connect(local); assert c.execute('select v from t').fetchone()[0]=='LOCAL_KEEP'; c.close()
          print('PASS local database conflict preservation')
          '@ | python -

      - name: Build Windows EXE
        shell: pwsh
        run: |
          Set-Location app
          python -m PyInstaller --onefile --windowed --name UchetZakupok --collect-data spellchecker --additional-hooks-dir=. main.py
          Set-Location ..
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item app/dist/UchetZakupok.exe release/UchetZakupok.exe -Force
          $hash=(Get-FileHash release/UchetZakupok.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  UchetZakupok.exe" | Set-Content release/UchetZakupok.exe.sha256 -Encoding ascii

      - name: Runtime EXE smoke test
        shell: pwsh
        run: |
          $env:LOCALAPPDATA="$env:RUNNER_TEMP\UchetZakupokSmoke"
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $p=Start-Process -FilePath "release\UchetZakupok.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "EXE exited with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Upload manual artifact
        uses: actions/upload-artifact@v4
        with:
          name: UchetZakupok-v2.18.0-manual
          path: |
            release/UchetZakupok.exe
            release/UchetZakupok.exe.sha256
          retention-days: 7
          if-no-files-found: error
