name: Validate v2.17
on:
  push:
    branches: [v2.17]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        shell: pwsh
        run: python -m pip install -r app/requirements.txt
      - name: Compile and import
        shell: pwsh
        run: |
          python -m compileall -q app
          python -c "import sys; sys.path.insert(0,'app'); import db,main,reminder_worker; assert db.EXEC_STATUS_OPTIONS == ['В процессе','Отправлено','Вручен','Исполнено']"
      - name: v2.17 workflow regression
        shell: pwsh
        run: |
          @'
          import os,sys,tempfile
          from datetime import date,timedelta
          sys.path.insert(0,'app')
          import db, reminder_worker
          p=os.path.join(tempfile.mkdtemp(),'v217.db')
          c=db.get_connection(p)
          h={'customer':'Тест','contract_no':'217','contract_status':'Заключен','exec_status':'В процессе','payment_status':'Не оплачено','deadline':(date.today()+timedelta(days=60)).isoformat(),'payment_deadline':(date.today()+timedelta(days=72)).isoformat()}
          pid=db.insert_purchase(c,h,[{'product':'Товар','qty':100,'supply_mode':'Отложенная закупка','stock_qty':40,'procurement_reminder_days':30}])
          it=db.fetch_items(c,pid)[0]
          assert it['supply_mode']=='Отложенная закупка' and it['stock_qty']==40
          st=db.stock_summary(c)[0]
          assert st['reserved']==40 and st['future_demand']==60
          assert not any(x['kind']=='procurement' for x in reminder_worker.attention_items(c))
          h2=dict(c.execute('select * from purchases where id=?',(pid,)).fetchone())
          h2['exec_status']='Отправлено'
          db.update_purchase(c,pid,h2,[dict(it)])
          assert c.execute('select stock_written_off from purchases where id=?',(pid,)).fetchone()[0]==1
          h3=dict(c.execute('select * from purchases where id=?',(pid,)).fetchone())
          h3['exec_status']='Вручен'; h3['handover_date']=date.today().isoformat()
          db.update_purchase(c,pid,h3,[dict(db.fetch_items(c,pid)[0])])
          st2=db.stock_summary(c)[0]
          assert st2['on_hand']==-40
          assert not any(x['kind']=='execution' for x in reminder_worker.attention_items(c))
          h4=dict(c.execute('select * from purchases where id=?',(pid,)).fetchone())
          h4['payment_deadline']=(date.today()+timedelta(days=3)).isoformat()
          db.update_purchase(c,pid,h4,[dict(db.fetch_items(c,pid)[0])])
          assert any(x['kind']=='payment' for x in reminder_worker.attention_items(c))
          c.close()
          print('v2.17 regression OK')
          '@ | python -
