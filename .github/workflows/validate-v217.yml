name: Validate v2.17
on:
  push:
    branches: [v2.17]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        shell: pwsh
        run: python -m pip install -r app/requirements.txt
      - name: Compile and import
        shell: pwsh
        run: |
          python -m compileall -q app
          python -c "import sys; sys.path.insert(0,'app'); import db,main,reminder_worker; assert db.EXEC_STATUS_OPTIONS == ['В процессе','Отправлено','Вручен','Исполнено']"
      - name: v2.17 database open
        shell: pwsh
        run: python -c "import os,sys,tempfile; sys.path.insert(0,'app'); import db; c=db.get_connection(os.path.join(tempfile.mkdtemp(),'x.db')); assert 'stock_written_off' in [r[1] for r in c.execute('pragma table_info(purchases)')]; assert 'supply_mode' in [r[1] for r in c.execute('pragma table_info(purchase_items)')]"
      - name: v2.17 item insert
        shell: pwsh
        run: |
          @'
          import os,sys,tempfile
          sys.path.insert(0,'app'); import db
          c=db.get_connection(os.path.join(tempfile.mkdtemp(),'x.db'))
          pid=db.insert_purchase(c,{'exec_status':'В процессе','payment_status':'Не оплачено'},[{'product':'Товар','qty':100,'supply_mode':'Отложенная закупка','stock_qty':40,'procurement_reminder_days':30}])
          it=dict(db.fetch_items(c,pid)[0]); assert it['supply_mode']=='Отложенная закупка'; assert it['stock_qty']==40
          '@ | python -
      - name: v2.17 stock summary
        shell: pwsh
        run: |
          @'
          import os,sys,tempfile
          sys.path.insert(0,'app'); import db
          c=db.get_connection(os.path.join(tempfile.mkdtemp(),'x.db'))
          pid=db.insert_purchase(c,{'exec_status':'В процессе','payment_status':'Не оплачено'},[{'product':'Товар','qty':100,'supply_mode':'Отложенная закупка','stock_qty':40,'procurement_reminder_days':30}])
          st=db.stock_summary(c); assert len(st)==1; assert st[0]['reserved']==40; assert st[0]['future_demand']==60
          '@ | python -
