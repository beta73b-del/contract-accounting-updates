name: Validate and build v2.17.3 manual

on:
  push:
    branches:
      - v2.17.3
    paths:
      - VERSION
      - app/**
      - tests/**
      - .github/workflows/validate-build-v2173.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt
      - name: Compile and import
        shell: pwsh
        run: |
          python -m compileall -q app
          python -c "import sys; sys.path.insert(0,'app'); import main; assert hasattr(main,'App'); assert hasattr(main,'PurchaseDialog')"
      - name: Verify version
        shell: pwsh
        run: |
          python -c "import sys; sys.path.insert(0,'app'); import app_version; assert app_version.__version__=='2.17.3'"
      - name: Run v2.17.2 regression suite
        shell: pwsh
        run: python tests/test_v2172_regression.py
      - name: Run v2.17.3 focused tests
        shell: pwsh
        run: python tests/test_v2173_changes.py
      - name: Verify manual update mode and menu methods
        shell: pwsh
        run: |
          python -c "from pathlib import Path; s=Path('app/main.py').read_text(encoding='utf-8'); assert 'self.after(1800, self._start_update_check)' not in s; assert 'Автоматическое обновление отключено' in s"
          python -c "import sys; sys.path.insert(0,'app'); import main; assert hasattr(main.App,'_open_trash'); assert hasattr(main.App,'_backup_now'); assert hasattr(main.App,'_restore_backup')"
      - name: Build Windows EXE
        shell: pwsh
        run: |
          Set-Location app
          python -m PyInstaller --onefile --windowed --name UchetZakupok --collect-data spellchecker --additional-hooks-dir=. main.py
          Set-Location ..
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item app/dist/UchetZakupok.exe release/UchetZakupok.exe -Force
          $hash=(Get-FileHash release/UchetZakupok.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  UchetZakupok.exe" | Set-Content release/UchetZakupok.exe.sha256 -Encoding ascii
      - name: Runtime EXE smoke test
        shell: pwsh
        run: |
          $env:LOCALAPPDATA="$env:RUNNER_TEMP\UchetZakupokSmoke"
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $p=Start-Process -FilePath "release\UchetZakupok.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "EXE exited with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - name: Upload manual artifact
        uses: actions/upload-artifact@v4
        with:
          name: UchetZakupok-v2.17.3-manual
          path: |
            release/UchetZakupok.exe
            release/UchetZakupok.exe.sha256
          retention-days: 7
          if-no-files-found: error
