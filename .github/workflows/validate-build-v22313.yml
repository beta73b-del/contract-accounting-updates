name: Validate and build v2.23.13
on:
  push:
    branches: [v2.23.13]
    paths: [VERSION, "app/**", "tests/**", ".github/workflows/validate-build-v22313.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt
      - name: Compile and import
        shell: pwsh
        run: |
          python -m compileall -q app
          python -c "import sys; sys.path.insert(0,'app'); import main,db; assert 'payment_date' in db.HEADER_FIELDS"
      - name: Regression 2.17.2
        run: python tests/test_v2172_regression.py
      - name: Regression 2.17.3
        run: python tests/test_v2173_changes.py
      - name: Regression 2.18.0
        run: python tests/test_v2180_finance.py
      - name: Regression 2.19.0
        run: python tests/test_v2190_tax.py
      - name: Regression 2.20.0
        run: python tests/test_v2200_competitors.py
      - name: Regression 2.21.0
        run: python tests/test_v2210_procurement.py
      - name: Regression 2.22.0
        run: python tests/test_v2220_history.py
      - name: Regression 2.22.1
        run: python tests/test_v2221_expenses.py
      - name: Regression 2.22.2
        run: python tests/test_v2222_realized_qty.py
      - name: Regression 2.22.3
        run: python tests/test_v2223_stock_need.py
      - name: Regression 2.23.0
        run: python tests/test_v2230_integrity.py
      - name: Regression 2.23.1
        run: python tests/test_v2231_monthly_expense_add.py
      - name: Regression 2.23.2
        run: python tests/test_v2232_products.py
      - name: Regression 2.23.3
        run: python tests/test_v2233_stability.py
      - name: Regression 2.23.4
        run: python tests/test_v2234_dashboard_period.py
      - name: Regression 2.23.5
        run: python tests/test_v2235_monthly_expense_period.py
      - name: Regression 2.23.6
        run: python tests/test_v2236_expense_dialog.py
      - name: Regression 2.23.7
        run: python tests/test_v2237_stock_dedupe.py
      - name: Regression 2.23.8
        run: python tests/test_v2238_expense_amount_only.py
      - name: Regression 2.23.9
        run: python tests/test_v2239_ota.py
      - name: Regression 2.23.10
        run: python tests/test_v22310_expense_ui.py
      - name: Regression 2.23.11
        run: python tests/test_v22311_ota_paths.py
      - name: Regression 2.23.12
        run: python tests/test_v22312_stock_competitors.py
      - name: Regression 2.23.13
        run: python tests/test_v22313_runtime_build.py
      - name: Verify paid button date binding
        shell: pwsh
        run: |
          python -c "from pathlib import Path; s=Path('app/main.py').read_text(encoding='utf-8'); assert 'payment_status' in s and 'payment_date' in s and 'Дата оплаты' in s and 'Отметить контракт оплаченным' in s"
      - name: Verify version
        shell: pwsh
        run: python -c "import sys; sys.path.insert(0,'app'); import app_version; assert app_version.__version__=='2.23.13'"
      - name: Build
        shell: pwsh
        run: |
          Set-Location app
          $pythonExe = (Get-Command python).Source
          $pythonDir = Split-Path -Parent $pythonExe
          $extra = @()
          foreach ($dll in @("vcruntime140.dll", "vcruntime140_1.dll")) {
            $candidate = Join-Path $pythonDir $dll
            if (-not (Test-Path $candidate)) {
              $candidate = Join-Path $env:SystemRoot "System32\$dll"
            }
            if (Test-Path $candidate) {
              $extra += "--add-binary"
              $extra += "$candidate;."
            }
          }
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name UchetZakupok --collect-data spellchecker --additional-hooks-dir=. @extra main.py
          Set-Location ..
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item app/dist/UchetZakupok.exe release/UchetZakupok.exe -Force
          $hash=(Get-FileHash release/UchetZakupok.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  UchetZakupok.exe" | Set-Content release/UchetZakupok.exe.sha256 -Encoding ascii
      - name: Verify embedded runtime
        shell: pwsh
        run: |
          $listing = pyi-archive_viewer release\UchetZakupok.exe -l 2>&1 | Out-String
          if ($listing -notmatch 'python311\.dll') { throw "python311.dll missing" }
          if ($listing -notmatch 'vcruntime140\.dll') { throw "vcruntime140.dll missing" }
      - name: Smoke
        shell: pwsh
        run: |
          $env:LOCALAPPDATA="$env:RUNNER_TEMP\Smoke"
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $p=Start-Process -FilePath "release\UchetZakupok.exe" -PassThru
          Start-Sleep 5
          if ($p.HasExited) { throw "EXE exited $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: UchetZakupok-v2.23.13
          path: |
            release/UchetZakupok.exe
            release/UchetZakupok.exe.sha256
          retention-days: 7
